services:
  mg-website:
    build:
      context: ..
      dockerfile: examples/Dockerfile.production
    container_name: mg-website
    user: "nginx:nginx"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    sysctls:
      # Allow non-root Nginx to retain the existing container port without capabilities.
      net.ipv4.ip_unprivileged_port_start: "0"
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - ai-backend

networks:
  ai-backend:
    external: true
