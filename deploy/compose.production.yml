name: malevolentgods

services:
  mg-website:
    image: ghcr.io/oberones/malevolentgods.com:${IMAGE_TAG:-latest}
    container_name: mg-website
    user: "nginx:nginx"
    cap_drop:
      - ALL
    sysctls:
      # Allow non-root Nginx to retain the existing container port without capabilities.
      net.ipv4.ip_unprivileged_port_start: "0"
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - ai-backend
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

networks:
  ai-backend:
    external: true
